    <!-- Video script -->
    <script>
        const video = document.getElementById("kurtyzana");

        function playPause() 
        {
            if (video.paused) 
            {
                video.play();
            } else 
            {
                video.pause();
            }
        }
        function stopVideo() 
        {
            video.pause();
            video.currentTime = 0;
        }
    </script>
