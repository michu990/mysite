<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='shortcut icon' href='media/images/icon.png' type='image/png'/>	
    <script src="http://code.jquery.com/jquery-1.8.3.min.js"></script>
    <title>michu990</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- style -->
    <style>
        body 
        {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #imageButton 
        {
            text-align: center;
        }
    </style>
</head>
<body>

     <!-- 3body simulation balls -->
     <div id="body1" class="body"></div>
     <div id="body2" class="body"></div>
     <div id="body3" class="body"></div>

       <!-- 3body script -->
    <script src="three_body.js"></script>
    <div id="app">
        <div id="three-body-animation" state="on"></div>

        <!-- 3body script on/off -->
    <script>
        const threeBodyAnimationOn = function () {
          const state = document.getElementById("three-body-animation").getAttribute("state");
          return state === "on";
        }
      </script>

    </div>
    <!-- audio source -->
    <audio id="audio" src="media/sounds/doormove10.wav" type="audio/wav"></audio>
    
    <!-- button -->
    <a id="imageButton" href="welcome.html" style="cursor: pointer;">
        <img src="media/gifs/cube.gif"/><br><br>
    </a>
    <!-- audio script -->
    <script>
        function playAudio()
        {
            var audio = document.getElementById("audio");
            audio.play();
        }
        document.getElementById('imageButton').addEventListener('click', function(event) {
            event.preventDefault();
            playAudio();
            setTimeout(function()
            {
                window.location.href = 'welcome.html'; 
            }, 2000);
        });
    </script>
</body>
</html>
