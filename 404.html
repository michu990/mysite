<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="skeleton.png">
    <style>
        /* 404 styles */
        body
        {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
            color: lime;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #error-container
        {
            max-width: 600px;
            padding: 20px;
            background-color: #12121200;
            border-radius: 10px;;
            text-align: center;
            z-index: 2;
        }
        #error-container h1
        {
            font-size: 3em;
            margin-bottom: 20px;
            color: lime;
        }
        #error-container p
        {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: lime;
        }
        #error-container img
        {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        #error-container a
        {
            color: lime;
            text-decoration: none;
            font-weight: bold;
        }
        #error-container a:hover
        {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- 404 -->
    <div id="error-container">
        <img src="https://http.cat/images/404.jpg" alt="Error 404 Image">
        <p><a href="https://michu990.me/" id="go-back-link">Go back!</a></p>
    </div>

    <!-- 3body simulation balls -->
    <div id="body1" class="body"></div>
    <div id="body2" class="body"></div>
    <div id="body3" class="body"></div>

    <!-- 3body script -->
    <script src="three_body.js"></script>
    <div id="app">
        <div id="three-body-animation" state="on"></div>
    </div>

    <!-- 3body script on/off -->
    <script>
        const threeBodyAnimationOn = function () {
          const state = document.getElementById("three-body-animation").getAttribute("state");
          return state === "on";
        }
    </script>

    <!-- Script to close current window and open new one -->
    <script>
        document.getElementById("go-back-link").addEventListener("click", function(event) {
            event.preventDefault();
            window.open("https://michu990.me/", "_blank");
            window.close();
        });
    </script>
</body>
</html>
