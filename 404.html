<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="stylesheet" href="style.css">
    <link rel='shortcut icon' href='media/images/icon.png' type='image/png'/>

</head>
    <!-- css -->
    <style>
        body
        {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: black;
            color: lime;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

    </style>
</head>
<body>

    <!-- 404 -->
    <div id="error-container">
        <img src="https://http.cat/images/404.jpg" alt="Error 404 Image">
        <p><a href="https://michu990.me/" id="go-back-link">Go back!</a></p>
    </div>

    <!-- Script to close current window and open new one -->
    <script>
        document.getElementById("go-back-link").addEventListener("click", function(event) {
            event.preventDefault();
            window.open("https://michu990.me/", "_blank");
            window.close();
        });
    </script>
</body>
</html>
